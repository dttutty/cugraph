schema_version: 1

context:
  version: ${{ env.get("RAPIDS_PACKAGE_VERSION") }}
  minor_version: ${{ (version | split("."))[:2] | join(".") }}
  cuda_version: ${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[:2] | join(".") }}
  cuda_major: '${{ (env.get("RAPIDS_CUDA_VERSION") | split("."))[0] }}'
  date_string: '${{ env.get("RAPIDS_DATE_STRING") }}'
  head_rev: '${{ git.head_rev(".")[:8] }}'
  py_runtime_latest: "3.14"

package:
  name: cugraph
  version: ${{ version }}

source:
  path: ../../..

build:
  string: cuda${{ cuda_major }}_py_${{ date_string }}_${{ head_rev }}
  script:
    content: |
      ./build.sh cugraph
    secrets:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    env:
      RAPIDS_ARTIFACTS_DIR: ${{ env.get("RAPIDS_ARTIFACTS_DIR", default="") }}
requirements:
  build:
    - cuda-version =${{ cuda_version }}
  host:
    - cuda-version =${{ cuda_version }}
    - pip
    - python
    - setuptools>=77.0.0
    - wheel
  run:
    - ${{ pin_compatible("cuda-version", upper_bound="x", lower_bound="x") }}
    - aiohttp
    - cudf =${{ minor_version }}
    - cupy >=13.6.0,!=14.0.0,!=14.1.0
    - dask-cuda =${{ minor_version }}
    - dask-cudf =${{ minor_version }}
    - fsspec>=0.6.0
    - libcugraph =${{ version }}
    - numba >=0.60.0,<0.65.0
    - numba-cuda >=0.22.2
    - pylibcudf =${{ minor_version }}
    - pylibcugraph =${{ version }}
    - pylibraft =${{ minor_version }}
    - python
    - raft-dask =${{ minor_version }}
    - rapids-dask-dependency =${{ minor_version }}
    - requests
    - ucxx ${{ ucxx_version }}
    - if: cuda_major == "12"
      then: cuda-python >=12.9.2,<13.0
      else: cuda-python >=13.0.1,<14.0
  ignore_run_exports:
    from_package:
    by_name:
      - cuda-version

tests:
  - python:
      imports:
        - cugraph
      python_version: ${{ py_runtime_latest }}.*
      pip_check: false

about:
  homepage: ${{ load_from_file("python/cugraph/pyproject.toml").project.urls.Homepage }}
  license: ${{ load_from_file("python/cugraph/pyproject.toml").project.license }}
  summary: ${{ load_from_file("python/cugraph/pyproject.toml").project.description }}
